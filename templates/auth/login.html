{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-11">

    <div class="card bg-dark border-warning p-4 hero-glow">

      <h3 class="text-warning text-center mb-4 fw-bold">
        User Login
      </h3>

      <form method="POST">

        <label class="text-warning fw-semibold mb-1">Email</label>
        <input
          class="form-control mb-3"
          name="email"
          type="email"
          placeholder="Enter your email"
          required
        >

        <label class="text-warning fw-semibold mb-1">Password</label>
        <input
          class="form-control mb-4"
          name="password"
          type="password"
          placeholder="Enter your password"
          required
        >

        <button class="btn btn-warning w-100 fw-bold">
          Login
        </button>

      </form>

      <p class="text-center text-light mt-4 mb-0">
        New user?
        <a href="/register" class="text-warning fw-semibold text-decoration-none">
          Register here
        </a>
      </p>

    </div>

  </div>
</div>

{% endblock %}

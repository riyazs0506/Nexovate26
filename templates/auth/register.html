{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-11">

    <div class="card bg-dark border-warning p-4 hero-glow">

      <h3 class="text-warning text-center mb-4 fw-bold">
        User Registration
      </h3>

      <form method="POST">

        <label class="text-warning fw-semibold mb-1">Full Name</label>
        <input
          class="form-control mb-3"
          name="name"
          placeholder="Enter your full name"
          required
        >

        <label class="text-warning fw-semibold mb-1">College Email</label>
        <input
          class="form-control mb-3"
          name="email"
          type="email"
          placeholder="Enter college email"
          required
        >

        <label class="text-warning fw-semibold mb-1">Password</label>
        <input
          class="form-control mb-4"
          name="password"
          type="password"
          placeholder="Create a password"
          required
        >

        <button class="btn btn-warning w-100 fw-bold">
          Register
        </button>

      </form>

      <p class="text-center text-light mt-4 mb-0">
        Already registered?
        <a href="/login" class="text-warning fw-semibold text-decoration-none">
          Login
        </a>
      </p>

    </div>

  </div>
</div>

{% endblock %}
